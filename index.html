<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root{
      --c1:#6366f1; --c2:#8b5cf6; --c3:#ec4899;
      --c4:#f97316; --c5:#10b981; --c6:#06b6d4;
      --bg:#070710; --bg2:#0c0c1d; --bg3:#111127; --bg4:#15152e;
      --text:#e2e8f0; --muted:#475569;
      --border:rgba(99,102,241,.14);
    }

    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{
      width:100%;height:100%;background:var(--bg);overflow:hidden;
      font-family:'Inter',system-ui,sans-serif;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
      color:var(--text);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--c1),var(--c3));border-radius:4px}

    /* ── Ambient canvas ── */
    #bg-canvas{
      position:fixed;inset:0;z-index:0;
      pointer-events:none;opacity:.3;
    }

    /* ── Overlay ── */
    #overlay{
      position:fixed;inset:0;z-index:9999;
      background:var(--bg);
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:22px;
    }
    .loader-wrap{position:relative;width:64px;height:64px}
    .loader-wrap svg{animation:spin 1.1s cubic-bezier(.5,0,.5,1) infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-glow{
      position:absolute;inset:0;border-radius:50%;
      background:radial-gradient(circle,rgba(99,102,241,.25) 0%,transparent 70%);
      animation:glow-pulse 2s ease-in-out infinite;
    }
    @keyframes glow-pulse{
      0%,100%{transform:scale(1);opacity:.5}
      50%{transform:scale(1.3);opacity:1}
    }
    .dots{display:flex;gap:7px;align-items:center}
    .dots span{
      width:7px;height:7px;border-radius:50%;
      animation:dot-bounce .85s ease-in-out infinite;
    }
    .dots span:nth-child(1){background:var(--c1)}
    .dots span:nth-child(2){background:var(--c2);animation-delay:.14s}
    .dots span:nth-child(3){background:var(--c3);animation-delay:.28s}
    @keyframes dot-bounce{
      0%,100%{transform:translateY(0);opacity:.35}
      50%{transform:translateY(-7px);opacity:1}
    }
    #loadMsg{color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.5px;text-align:center}

    /* ── Toast ── */
    #status{
      position:fixed;
      top:max(14px,env(safe-area-inset-top));
      right:max(14px,env(safe-area-inset-right));
      z-index:9997;
      padding:6px 16px;
      font-size:11px;font-weight:600;letter-spacing:.3px;border-radius:24px;
      pointer-events:none;
      opacity:0;transform:translateY(-8px);
      transition:opacity .3s,transform .3s;
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      max-width:260px;
    }
    #status.show{opacity:1;transform:translateY(0)}
    #status.ok  {background:rgba(16,185,129,.14);color:#34d399;border:1px solid rgba(16,185,129,.22)}
    #status.warn{background:rgba(249,115,22,.14); color:#fb923c;border:1px solid rgba(249,115,22,.22)}
    #status.err {background:rgba(239,68,68,.14);  color:#f87171;border:1px solid rgba(239,68,68,.22)}

    /* ── Channel list ── */
    #channel-list{
      position:fixed;inset:0;z-index:9998;
      background:var(--bg);
      display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;
      padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
      opacity:0;transition:opacity .4s ease;
    }
    #channel-list.ready{opacity:1}

    /* Header */
    .header{
      display:flex;align-items:center;gap:12px;
      margin-bottom:18px;flex-wrap:wrap;
    }
    .logo-mark{
      width:40px;height:40px;flex-shrink:0;
      background:linear-gradient(135deg,var(--c1),var(--c3));
      border-radius:11px;
      display:flex;align-items:center;justify-content:center;
      font-size:20px;
      animation:logo-pulse 3s ease-in-out infinite;
    }
    @keyframes logo-pulse{
      0%,100%{box-shadow:0 0 18px rgba(99,102,241,.4)}
      50%{box-shadow:0 0 32px rgba(236,72,153,.55)}
    }
    .header-text{flex:1;min-width:0}
    .header-text h1{
      font-size:21px;font-weight:900;letter-spacing:-.4px;
      background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;background-size:200%;
      animation:hue-shift 5s linear infinite;
    }
    @keyframes hue-shift{0%{background-position:0%}100%{background-position:200%}}
    .header-text .sub{
      font-size:10px;font-weight:500;color:var(--muted);
      letter-spacing:.6px;text-transform:uppercase;margin-top:1px;
    }
    #channelCount{
      margin-left:auto;
      font-size:11px;font-weight:600;
      background:rgba(99,102,241,.1);
      border:1px solid rgba(99,102,241,.18);
      color:var(--c1);padding:4px 13px;border-radius:20px;
      transition:all .3s;
    }

    /* Search */
    #search-wrap{position:relative;margin-bottom:14px}
    #search-input{
      width:100%;padding:11px 40px 11px 42px;
      border-radius:14px;border:1px solid var(--border);
      background:var(--bg3);color:var(--text);
      font-size:13px;font-weight:500;font-family:inherit;
      outline:none;transition:all .3s;
    }
    #search-input:focus{
      border-color:rgba(99,102,241,.45);
      background:var(--bg4);
      box-shadow:0 0 0 3px rgba(99,102,241,.1),0 0 18px rgba(99,102,241,.06);
    }
    #search-input::placeholder{color:var(--muted);font-size:12px}
    .s-icon{
      position:absolute;left:14px;top:50%;transform:translateY(-50%);
      font-size:14px;color:var(--muted);pointer-events:none;
    }
    #search-clear{
      position:absolute;right:10px;top:50%;transform:translateY(-50%);
      background:rgba(255,255,255,.05);border:none;
      color:var(--muted);font-size:12px;cursor:pointer;
      padding:3px 8px;border-radius:8px;line-height:1.5;
      transition:all .2s;display:none;
    }
    #search-clear:hover{background:rgba(255,255,255,.1);color:#ccc}
    #search-clear.on{display:block}

    /* Group pills */
    #grp-bar{
      display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0;
    }
    #grp-bar::-webkit-scrollbar{display:none}
    .g-pill{
      flex-shrink:0;padding:5px 14px;border-radius:20px;
      font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
      cursor:pointer;white-space:nowrap;
      background:var(--bg3);color:var(--muted);border:1px solid var(--border);
      transition:all .22s;
    }
    .g-pill:hover{background:var(--bg4);color:var(--text)}
    .g-pill.on{
      background:linear-gradient(135deg,var(--c1),var(--c2));
      color:#fff;border-color:transparent;
      box-shadow:0 4px 18px rgba(99,102,241,.32);
    }

    /* Grid */
    #ch-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
      gap:12px;padding-bottom:24px;width:100%;
    }

    /* Card */
    .ch-card{
      background:var(--bg2);border:1px solid var(--border);border-radius:16px;
      padding:16px 12px;cursor:pointer;text-decoration:none;
      display:flex;flex-direction:column;align-items:center;text-align:center;
      gap:9px;min-height:128px;justify-content:center;
      position:relative;overflow:hidden;width:100%;
      /* stagger-in */
      opacity:0;transform:translateY(14px) scale(.97);
      transition:
        opacity .35s ease,
        transform .35s cubic-bezier(.4,0,.2,1),
        border-color .25s,
        box-shadow .25s;
    }
    .ch-card.in{opacity:1;transform:translateY(0) scale(1)}
    /* shimmer overlay */
    .ch-card::after{
      content:'';position:absolute;inset:0;border-radius:16px;
      background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 55%);
      pointer-events:none;
    }
    .ch-card:hover{
      transform:translateY(-3px) scale(1.025);
      border-color:rgba(99,102,241,.4);
      box-shadow:0 8px 28px rgba(99,102,241,.14),0 0 0 1px rgba(99,102,241,.08);
    }
    .ch-card:active{transform:scale(.95)}

    /* top accent */
    .ch-card .acc{
      position:absolute;top:0;left:0;right:0;height:2px;
      border-radius:16px 16px 0 0;opacity:.75;
    }
    /* group badge */
    .ch-card .grp-badge{
      position:absolute;top:8px;right:8px;
      font-size:7px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
      padding:2px 7px;border-radius:8px;opacity:.85;
    }
    /* channel # badge */
    .ch-card .num-badge{
      position:absolute;top:8px;left:8px;
      font-size:7px;font-weight:700;letter-spacing:.3px;
      padding:2px 7px;border-radius:8px;
      background:rgba(99,102,241,.15);color:var(--c1);
      border:1px solid rgba(99,102,241,.2);
    }

    .ch-logo{
      width:100%;max-width:96px;height:auto;max-height:50px;
      object-fit:contain;border-radius:6px;padding:3px;
      transition:transform .3s;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
    }
    .ch-card:hover .ch-logo{transform:scale(1.08)}

    .ch-ph{
      width:96px;height:50px;border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;font-weight:800;letter-spacing:1px;
    }
    .ch-name{
      color:var(--text);font-size:11px;font-weight:600;
      line-height:1.3;letter-spacing:.1px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;max-height:30px;width:100%;
    }

    /* No results */
    #no-res{
      display:none;color:var(--muted);text-align:center;
      padding:60px 20px;font-size:13px;width:100%;
      animation:fadeUp .4s ease;
    }
    #no-res .ico{font-size:44px;display:block;margin-bottom:14px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    /* ── Player ── */
    #pc{
      position:fixed;inset:0;background:#000;display:none;
      align-items:center;justify-content:center;touch-action:manipulation;
    }
    video{width:100%;height:100%;object-fit:contain;background:#000;will-change:transform}
    video.mode-fill{object-fit:fill}
    video.mode-cover{object-fit:cover}

    /* Shaka custom */
    .sp-btn{
      background:transparent!important;border:none!important;
      cursor:pointer!important;padding:0 8px!important;
      opacity:.8;display:flex;align-items:center;justify-content:center;gap:5px;
      height:100%;min-width:36px;transition:opacity .15s,color .15s;
      color:#fff!important;-webkit-tap-highlight-color:transparent;
    }
    .sp-btn:hover{opacity:1}
    .sp-btn:active{opacity:1;transform:scale(.92)}
    .sp-btn svg{width:18px;height:18px;display:block;pointer-events:none;flex-shrink:0}
    .sp-btn.active{opacity:1;color:var(--c1)!important}
    .fit-ratio{font-size:11px;font-weight:600;letter-spacing:.2px;line-height:1;white-space:nowrap;pointer-events:none}
    .shaka-controls-container .shaka-play-button,
    .shaka-controls-container .shaka-mute-button,
    .shaka-controls-container .shaka-fullscreen-button,
    .shaka-controls-container .shaka-overflow-menu-button{color:var(--c1)!important}
    .shaka-controls-container .shaka-seek-bar .shaka-seek-bar-played{
      background:linear-gradient(90deg,var(--c1),var(--c2))!important;
    }
    .shaka-controls-container .shaka-seek-bar .shaka-seek-bar-buffered{
      background:rgba(99,102,241,.28)!important;
    }

    /* ── Responsive ── */
    @media(max-width:480px){
      #ch-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
      .ch-card{min-height:106px;padding:12px 8px;border-radius:13px}
      .ch-logo{max-height:36px;max-width:76px}
      .ch-ph{width:76px;height:36px;font-size:13px}
      .ch-name{font-size:10px}
      .header-text h1{font-size:17px}
      .g-pill{font-size:9px;padding:4px 11px}
    }
    @media(max-width:360px){
      #ch-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px}
      .ch-card{min-height:90px;padding:9px 6px;border-radius:11px}
      .ch-logo{max-height:30px;max-width:64px}
      .ch-ph{width:64px;height:30px;font-size:11px}
    }
    @media(min-width:768px){
      #ch-grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
      .ch-card{min-height:148px;padding:20px 14px}
      .ch-logo{max-height:62px;max-width:120px}
      .ch-ph{width:120px;height:62px;font-size:18px}
      .ch-name{font-size:13px}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>

<!-- Ambient BG -->
<canvas id="bg-canvas"></canvas>

<!-- Loading overlay -->
<div id="overlay">
  <div class="loader-wrap">
    <div class="loader-glow"></div>
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="26" stroke="#1a1a3a" stroke-width="5"/>
      <path d="M32 6 a26 26 0 0 1 26 26" stroke="url(#lg1)" stroke-width="5" stroke-linecap="round"/>
      <defs>
        <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#6366f1"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <div class="dots"><span></span><span></span><span></span></div>
  <p id="loadMsg">Loading…</p>
</div>

<div id="status"></div>

<!-- Channel list -->
<div id="channel-list">
  <div class="header">
    <div class="logo-mark">⚡</div>
    <div class="header-text">
      <h1>SPORTLINK</h1>
      <div class="sub">Star · Live Streams</div>
    </div>
    <span id="channelCount">0 channels</span>
  </div>

  <div id="search-wrap">
    <span class="s-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search channels…" autocomplete="off">
    <button id="search-clear" aria-label="Clear">✕</button>
  </div>

  <div id="grp-bar"></div>
  <div id="ch-grid"></div>
  <div id="no-res"><span class="ico">📺</span>No channels found.</div>
</div>

<!-- Player -->
<div id="pc">
  <video id="v" playsinline webkit-playsinline
    preload="none" x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";

/* ════════════════════════════════════════════
   AMBIENT CANVAS
════════════════════════════════════════════ */
(function(){
  var cv=document.getElementById('bg-canvas');
  var cx=cv.getContext('2d');
  var COLS=['#6366f1','#8b5cf6','#ec4899','#f97316','#06b6d4','#10b981','#eab308'];
  var orbs=[];
  function resize(){ cv.width=innerWidth; cv.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  for(var i=0;i<8;i++) orbs.push({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    r:100+Math.random()*200,
    dx:(Math.random()-.5)*.45, dy:(Math.random()-.5)*.45,
    col:COLS[i%COLS.length], ph:Math.random()*Math.PI*2
  });
  function frame(t){
    cx.clearRect(0,0,cv.width,cv.height);
    orbs.forEach(function(o){
      o.x+=o.dx; o.y+=o.dy;
      var p=1+.1*Math.sin(t*.0008+o.ph);
      if(o.x<-o.r||o.x>cv.width+o.r)  o.dx*=-1;
      if(o.y<-o.r||o.y>cv.height+o.r) o.dy*=-1;
      var g=cx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*p);
      g.addColorStop(0,o.col+'4a'); g.addColorStop(1,'transparent');
      cx.beginPath(); cx.fillStyle=g;
      cx.arc(o.x,o.y,o.r*p,0,Math.PI*2); cx.fill();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ════════════════════════════════════════════
   CONFIG / REFS
════════════════════════════════════════════ */
var API="https://raw.githubusercontent.com/sportlive18/jio-tv-auto-update-playlist/refs/heads/main/star2.json";

var $overlay   =document.getElementById("overlay");
var $loadMsg   =document.getElementById("loadMsg");
var $status    =document.getElementById("status");
var $list      =document.getElementById("channel-list");
var $grid      =document.getElementById("ch-grid");
var $grpBar    =document.getElementById("grp-bar");
var $sInput    =document.getElementById("search-input");
var $sClear    =document.getElementById("search-clear");
var $noRes     =document.getElementById("no-res");
var $count     =document.getElementById("channelCount");
var $pc        =document.getElementById("pc");
var $vid       =document.getElementById("v");
var _stTmr     =null;
var allChannels=[];
var curGroup   ='All';
var searchQ    ='';

/* ════════════════════════════════════════════
   GROUP → COLOUR MAP
════════════════════════════════════════════ */
var GRP_STYLE={
  'Sports':     {bg:'rgba(239,68,68,.14)',   txt:'#f87171',  strip:'#ef4444,#f97316'},
  'News':       {bg:'rgba(6,182,212,.14)',   txt:'#22d3ee',  strip:'#06b6d4,#6366f1'},
  'Movies':     {bg:'rgba(139,92,246,.14)',  txt:'#a78bfa',  strip:'#8b5cf6,#ec4899'},
  'Kids':       {bg:'rgba(234,179,8,.14)',   txt:'#fbbf24',  strip:'#eab308,#f97316'},
  'Music':      {bg:'rgba(236,72,153,.14)',  txt:'#f472b6',  strip:'#ec4899,#8b5cf6'},
  'Lifestyle':  {bg:'rgba(16,185,129,.14)',  txt:'#34d399',  strip:'#10b981,#06b6d4'},
  'Infotainment':{bg:'rgba(249,115,22,.14)',txt:'#fb923c',   strip:'#f97316,#eab308'},
  'General':    {bg:'rgba(99,102,241,.10)',  txt:'#818cf8',  strip:'#6366f1,#8b5cf6'},
  'Entertainment':{bg:'rgba(236,72,153,.14)',txt:'#f472b6',  strip:'#ec4899,#f97316'},
  'Regional':   {bg:'rgba(16,185,129,.14)',  txt:'#34d399',  strip:'#10b981,#eab308'},
  'Devotional': {bg:'rgba(234,179,8,.14)',   txt:'#fbbf24',  strip:'#eab308,#f97316'},
};
var STRIPS=['#6366f1,#8b5cf6','#ec4899,#f97316','#10b981,#06b6d4','#f97316,#eab308','#8b5cf6,#ec4899','#06b6d4,#6366f1'];
function gStyle(g){return GRP_STYLE[g]||{bg:'rgba(99,102,241,.10)',txt:'#818cf8',strip:'#6366f1,#8b5cf6'};}

/* ════════════════════════════════════════════
   REVEAL OBSERVER
════════════════════════════════════════════ */
var io=new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}
  });
},{threshold:.05});

/* ════════════════════════════════════════════
   DEVICE TIER
════════════════════════════════════════════ */
function getTier(){
  var mem=navigator.deviceMemory||4, cor=navigator.hardwareConcurrency||4;
  var mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  var net=conn?(conn.effectiveType||"4g"):"4g";
  if(!mob) return"high";
  if(mem<=1.5||cor<=2||net==="slow-2g"||net==="2g") return"low";
  if(mem<=3||cor<=4) return"mid";
  return"high";
}
var TIER=getTier();
var PROF={
  low: {buf:5, reBuf:1.5,behind:15,maxH:480, maxBw:1200000,bwEst:400000},
  mid: {buf:8, reBuf:1.5,behind:25,maxH:720, maxBw:3500000,bwEst:1000000},
  high:{buf:12,reBuf:1.5,behind:30,maxH:1080,maxBw:0,       bwEst:2000000}
}[TIER];

/* ════════════════════════════════════════════
   FIT MODES / ICONS
════════════════════════════════════════════ */
var FITS=["contain","fill","cover"];
var MODE_LABEL={contain:"Fit",fill:"Fill",cover:"Zoom"};
var FICO={
  contain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="21" x2="22" y2="21"/></svg>',
  fill:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
  cover:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M6 7l3 3m0 0H7m2 0V8m9-1l-3 3m0 0h2m-2 0V8M6 13l3-3m0 0H7m2 0v2m9 1l-3-3m0 0h2m-2 0v2"/></svg>'
};
var PIP_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>';

/* ════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════ */
function toast(msg,type,dur){
  $status.textContent=msg;
  $status.className="show "+(type||"ok");
  if(_stTmr) clearTimeout(_stTmr);
  if(dur!==0){
    _stTmr=setTimeout(function(){
      $status.className=$status.className.replace("show","").trim();
      _stTmr=null;
    },dur||4000);
  }
}
function setMsg(m){$loadMsg&&($loadMsg.textContent=m);}
function hideOverlay(){
  $overlay.style.transition="opacity .4s ease";
  $overlay.style.opacity="0";
  setTimeout(function(){$overlay.style.display="none";},420);
}
function getChId(){return new URLSearchParams(location.search).get("id")||"";}
function rawCookie(c){
  if(!c) return"";
  if(c.startsWith("Cookie=")) c=c.substring(7);
  if(c.startsWith("__hdnea__=")) return c.slice(10);
  return c;
}
function withCookie(u,r){
  if(!u||!r) return u;
  if(u.indexOf("__hdnea__")!==-1) return u;
  return u+(u.indexOf("?")!==-1?"&":"?")+"__hdnea__="+r;
}

/* ── Parse pipe-separated params ── */
function parseStreamUrl(raw){
  var res={url:raw,userAgent:null,referer:null,origin:null,cookie:null};
  if(!raw) return res;
  var pi=raw.indexOf('|');
  if(pi!==-1){
    res.url=raw.substring(0,pi);
    raw.substring(pi+1).split('&').forEach(function(p){
      var ei=p.indexOf('=');
      if(ei!==-1){
        var k=p.substring(0,ei).trim(), v=p.substring(ei+1).trim();
        if(k==='User-Agent') res.userAgent=v;
        else if(k==='Referer') res.referer=v;
        else if(k==='Origin')  res.origin=v;
        else if(k==='Cookie')  res.cookie=v;
      }
    });
  }
  return res;
}

/* ════════════════════════════════════════════
   LOAD DATA
════════════════════════════════════════════ */
async function loadData(){
  var r=await fetch(API,{cache:"no-store",headers:{Accept:"application/json"}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  var d=await r.json();
  var channels=[];
  if(d&&Array.isArray(d.channels))     channels=d.channels;
  else if(d&&Array.isArray(d))         channels=d;
  else if(d&&d.id)                     channels=[d];
  else throw new Error("Invalid data format");

  channels=channels.map(function(ch){
    var n={
      id:ch.id||'',
      name:ch.name||'Unnamed',
      stream_url:ch.stream_url||ch.mpd_url||'',
      cookie:ch.cookie||'',
      cookie_expires:ch.cookie_expires||'',
      key_id:ch.key_id||ch.keyId||'',
      key:ch.key||'',
      logo:ch.logo||'',
      group:ch.group||ch.category||'General'
    };
    var parsed=parseStreamUrl(n.stream_url);
    n.stream_url=parsed.url;
    if(parsed.userAgent) n.user_agent=parsed.userAgent;
    if(parsed.referer)   n.referer=parsed.referer;
    if(parsed.origin)    n.origin=parsed.origin;
    if(parsed.cookie&&!n.cookie) n.cookie=parsed.cookie;
    if(n.stream_url) n.stream_url=n.stream_url.replace(/\/\//g,'/').replace(':/',':// ').trim().replace('// ','//');
    var m=n.name.match(/^(\d+)\s/);
    if(m) n.channel_number=m[1];
    return n;
  });
  if(!channels.length) throw new Error("No channels");
  return{channels:channels};
}

/* ════════════════════════════════════════════
   RENDER GROUPS (pills)
════════════════════════════════════════════ */
function renderGroups(channels){
  var groups=['All'],seen={};
  channels.forEach(function(ch){ if(ch.group) seen[ch.group]=true; });
  Object.keys(seen).sort().forEach(function(g){ groups.push(g); });
  var f=document.createDocumentFragment();
  groups.forEach(function(g){
    var p=document.createElement('span');
    p.className='g-pill'+(g===curGroup?' on':'');
    p.textContent=g; p.dataset.g=g;
    p.addEventListener('click',function(){
      curGroup=g;
      document.querySelectorAll('.g-pill').forEach(function(x){
        x.classList.toggle('on',x.dataset.g===g);
      });
      applyFilters();
    });
    f.appendChild(p);
  });
  $grpBar.innerHTML='';
  $grpBar.appendChild(f);
}

/* ════════════════════════════════════════════
   FILTER + RENDER CARDS
════════════════════════════════════════════ */
function applyFilters(){
  var list=allChannels;
  if(curGroup!=='All') list=list.filter(function(c){return c.group===curGroup;});
  if(searchQ.trim()){
    var q=searchQ.trim().toLowerCase();
    list=list.filter(function(c){return c.name.toLowerCase().includes(q);});
  }
  renderCards(list);
}

function renderCards(list){
  $count.textContent=list.length+' channels';
  if(!list.length){
    $grid.style.display='none'; $noRes.style.display='block'; return;
  }
  $grid.style.display='grid'; $noRes.style.display='none';

  var f=document.createDocumentFragment();
  list.forEach(function(ch,i){
    var a=document.createElement('a');
    a.className='ch-card';
    a.href='?id='+encodeURIComponent(ch.id);
    a.style.transitionDelay=(Math.min(i,24)*.028)+'s';

    var gs=gStyle(ch.group);

    /* accent strip */
    var acc=document.createElement('div');
    acc.className='acc';
    acc.style.background='linear-gradient(90deg,'+gs.strip+')';
    a.appendChild(acc);

    /* group badge */
    if(ch.group&&ch.group!=='General'){
      var gb=document.createElement('span');
      gb.className='grp-badge';
      gb.textContent=ch.group;
      gb.style.background=gs.bg;
      gb.style.color=gs.txt;
      gb.style.border='1px solid '+gs.txt+'33';
      a.appendChild(gb);
    }

    /* channel number badge */
    if(ch.channel_number){
      var nb=document.createElement('span');
      nb.className='num-badge';
      nb.textContent='#'+ch.channel_number;
      a.appendChild(nb);
    }

    /* logo / placeholder */
    if(ch.logo&&ch.logo.trim()){
      var img=document.createElement('img');
      img.className='ch-logo';
      img.src=ch.logo; img.alt=ch.name; img.loading='lazy';
      img.onerror=function(){this.style.display='none';};
      a.appendChild(img);
    } else {
      var initials=ch.name.split(' ').slice(0,2).map(function(w){return w[0]||'';}).join('');
      var ph=document.createElement('div');
      ph.className='ch-ph';
      ph.style.background=gs.bg;
      ph.style.border='1px solid '+gs.txt+'33';
      ph.style.color=gs.txt;
      ph.textContent=initials;
      a.appendChild(ph);
    }

    /* name */
    var nm=document.createElement('span');
    nm.className='ch-name'; nm.textContent=ch.name;
    a.appendChild(nm);

    f.appendChild(a);
    io.observe(a);
  });

  $grid.innerHTML='';
  $grid.appendChild(f);
}

/* ════════════════════════════════════════════
   RENDER LIST
════════════════════════════════════════════ */
function renderList(data){
  allChannels=data.channels||data;
  renderGroups(allChannels);
  applyFilters();
  $list.style.display='flex';
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ $list.classList.add('ready'); });
  });
  hideOverlay();
}

/* ════════════════════════════════════════════
   SEARCH
════════════════════════════════════════════ */
$sInput.addEventListener('input',function(){
  searchQ=$sInput.value;
  $sClear.classList.toggle('on',searchQ.length>0);
  applyFilters();
});
$sClear.addEventListener('click',function(){
  $sInput.value=''; searchQ='';
  $sClear.classList.remove('on');
  applyFilters(); $sInput.focus();
});

/* ════════════════════════════════════════════
   PLAYER UTILS
════════════════════════════════════════════ */
function errMsg(msg){ setMsg(msg); $overlay.style.display='flex'; toast(msg,'err',0); }
function shakaErrStr(e){
  if(!e) return"Unknown error";
  var c={1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Streaming",6:"DRM",7:"Player"};
  var s=(c[e.category]||"Err")+" "+e.category+":"+e.code;
  if(e.data&&e.data[0]&&typeof e.data[0]==="string") s+=" — "+e.data[0].slice(0,72);
  return s;
}
function ratioLabel(w,h){
  if(!w||!h) return"";
  function gcd(a,b){return b?gcd(b,a%b):a;}
  var g=gcd(w,h)||1,rw=w/g,rh=h/g;
  var common={"16:9":16/9,"4:3":4/3,"21:9":21/9,"1:1":1,"9:16":9/16,"3:2":3/2};
  var real=w/h,best=null,bd=.02;
  Object.keys(common).forEach(function(k){ var d=Math.abs(common[k]-real); if(d<bd){bd=d;best=k;} });
  if(best) return best;
  if(rw<=40&&rh<=40) return rw+":"+rh;
  return real.toFixed(2)+":1";
}
function injectControls(container,vid,player){
  var panel=container.querySelector(".shaka-controls-button-panel");
  if(!panel) return;
  var anchor=panel.querySelector(".shaka-fullscreen-button");

  var fitIdx=0;
  var fitBtn=document.createElement("button");
  fitBtn.className="sp-btn sp-fit-btn"; fitBtn.title="Video fit: Fit";
  fitBtn.innerHTML='<span class="fit-icon">'+FICO.contain+'</span><span class="fit-ratio">--</span>';
  if(anchor) panel.insertBefore(fitBtn,anchor); else panel.appendChild(fitBtn);

  function applyFit(i){
    fitIdx=i; var m=FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m==="fill") vid.classList.add("mode-fill");
    if(m==="cover") vid.classList.add("mode-cover");
    var ic=fitBtn.querySelector(".fit-icon");
    if(ic) ic.innerHTML=FICO[m];
    fitBtn.title="Video fit: "+MODE_LABEL[m];
  }
  fitBtn.addEventListener("click",function(e){ e.stopPropagation(); applyFit((fitIdx+1)%FITS.length); });
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev,function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement)) applyFit(0);
    });
  });
  function updateRatio(){
    var l=ratioLabel(vid.videoWidth,vid.videoHeight);
    var b=fitBtn.querySelector(".fit-ratio");
    if(b&&l) b.textContent=l;
  }
  vid.addEventListener("loadedmetadata",updateRatio);
  vid.addEventListener("resize",updateRatio);
  updateRatio();

  var pipOk=!!(document.pictureInPictureEnabled||
    (vid.webkitSupportsPresentationMode&&typeof vid.webkitSetPresentationMode==="function"));
  if(pipOk){
    var pipBtn=document.createElement("button");
    pipBtn.className="sp-btn sp-pip-btn"; pipBtn.title="Picture in Picture";
    pipBtn.innerHTML=PIP_ICON;
    panel.insertBefore(pipBtn,fitBtn);
    function setPip(a){
      pipBtn.classList.toggle("active",a);
      pipBtn.title=a?"Exit PiP":"Picture in Picture";
    }
    pipBtn.addEventListener("click",async function(e){
      e.stopPropagation();
      try{
        if(document.pictureInPictureEnabled){
          if(document.pictureInPictureElement) await document.exitPictureInPicture();
          else await vid.requestPictureInPicture();
        } else if(vid.webkitSupportsPresentationMode){
          vid.webkitSetPresentationMode(
            vid.webkitPresentationMode==="picture-in-picture"?"inline":"picture-in-picture");
        }
      } catch(_){ toast("PiP unavailable","warn",2500); }
    });
    vid.addEventListener("enterpictureinpicture",function(){ setPip(true); });
    vid.addEventListener("leavepictureinpicture",function(){ setPip(false); });
    if(vid.webkitPresentationMode!==undefined){
      vid.addEventListener("webkitpresentationmodechanged",function(){
        setPip(vid.webkitPresentationMode==="picture-in-picture");
      });
    }
  }
}

/* ════════════════════════════════════════════
   PLAYER
════════════════════════════════════════════ */
async function startPlayer(ch){
  $pc.style.display="flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ errMsg("Browser not supported."); return; }
  var player=new shaka.Player();
  await player.attach($vid);
  new shaka.ui.Overlay(player,$pc,$vid).configure({
    controlPanelElements:["play_pause","mute","volume","time_and_duration","spacer","quality","fullscreen"],
    seekBarColors:{base:"#334155",buffered:"rgba(99,102,241,.35)",played:"#6366f1"}
  });
  setTimeout(function(){ injectControls($pc,$vid,player); },100);

  var cookie=ch.cookie||'';
  if(cookie&&!cookie.startsWith('__hdnea__=')) cookie='__hdnea__='+cookie;
  var raw=rawCookie(cookie);
  var keyId=ch.key_id||'', key=ch.key||'', url=ch.stream_url||'';
  var restrictionsRelaxed=false;

  function buildCfg(){
    var restr={};
    if(!restrictionsRelaxed){
      if(PROF.maxH<1080) restr.maxHeight=PROF.maxH;
      if(PROF.maxBw>0)   restr.maxBandwidth=PROF.maxBw;
    }
    var cfg={
      manifest:{defaultPresentationDelay:4,ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}},
      streaming:{lowLatencyMode:false,bufferingGoal:PROF.buf,rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,safeSeekOffset:4,stallEnabled:true,stallThreshold:1,stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}},
      abr:{enabled:true,defaultBandwidthEstimate:PROF.bwEst,switchInterval:4,restrictions:restr}
    };
    if(keyId&&key) cfg.drm={clearKeys:{[keyId]:key}};
    return cfg;
  }
  player.configure(buildCfg());

  var T=shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type,req){
    req.headers["Referer"]=ch.referer||"https://www.jiotv.com/";
    req.headers["User-Agent"]=ch.user_agent||"Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    req.headers["Origin"]=ch.origin||"https://www.jiotv.com";
    if(cookie) req.headers["Cookie"]=cookie;
    if(type===T.MANIFEST||type===T.SEGMENT)
      req.uris=req.uris.map(function(u){return withCookie(u,raw);});
  });

  var refreshing=false,retries=0,edgeTried=false,lastTry=0,started=false;
  function unmuteOnce(){ $vid.muted=false; }
  $pc.addEventListener("pointerdown",unmuteOnce,{capture:true,once:true});
  $pc.addEventListener("click",unmuteOnce,{capture:true,once:true});
  $pc.addEventListener("keydown",unmuteOnce,{capture:true,once:true});

  function goLiveEdge(){
    if(refreshing) return;
    try{ player.goToLive(); edgeTried=true; toast("Syncing…","warn",2000); }
    catch(_){ reload(); }
  }
  async function reload(){
    var now=Date.now();
    if(refreshing||now-lastTry<1500) return;
    if(retries>=5){ toast("Stream unavailable.","err",0); return; }
    refreshing=true; lastTry=now; retries++;
    toast("Reconnecting… ("+retries+"/5)","warn",0);
    try{
      var d=await loadData();
      var chs=d.channels||d;
      var fresh=chs.find(function(c){return c.id===ch.id;});
      if(!fresh) throw new Error("missing");
      cookie=fresh.cookie||'';
      if(cookie&&!cookie.startsWith('__hdnea__=')) cookie='__hdnea__='+cookie;
      raw=rawCookie(cookie);
      keyId=fresh.key_id||''; key=fresh.key||''; url=fresh.stream_url||'';
      player.configure(buildCfg());
      await player.load(url);
      $vid.play().catch(function(){});
      retries=0; edgeTried=false; toast("● Live","ok",4000);
    } catch(_){
      setTimeout(reload,Math.min(1000*Math.pow(2,retries-1),8000));
    } finally{ refreshing=false; }
  }

  var RECOVERABLE=[1001,1002,1003,4012,6006,6007,7000,7001,7002];
  player.addEventListener("error",function(ev){
    var err=ev.detail,code=err&&err.code;
    if(code===4014&&!restrictionsRelaxed){
      restrictionsRelaxed=true; refreshing=true;
      player.configure(buildCfg());
      toast("Playing best available quality","warn",2500);
      player.load(url)
        .then(function(){ $vid.play().catch(function(){}); toast("● Live","ok",4000); })
        .catch(function(){ reload(); })
        .finally(function(){ refreshing=false; });
      return;
    }
    if(RECOVERABLE.indexOf(code)!==-1) reload();
    else toast(shakaErrStr(err),"err",6000);
  });

  try{
    setMsg("Loading stream…"); toast("Loading…","warn",0);
    await player.load(url);
    hideOverlay(); toast("Tap ▶ to start","ok",5000);
  } catch(_){
    hideOverlay(); toast("Retrying…","warn",0);
    setTimeout(reload,1500); return;
  }

  var stallTmr=null;
  function onStall(){
    if(!started||stallTmr||refreshing) return;
    toast("Buffering…","warn",0);
    stallTmr=setTimeout(function(){
      stallTmr=null;
      if(!edgeTried) goLiveEdge(); else reload();
    },5000);
  }
  function onPlaying(){
    started=true;
    if(stallTmr){clearTimeout(stallTmr);stallTmr=null;}
    edgeTried=false;
    if(!refreshing) toast("● Live","ok",3000);
  }
  $vid.addEventListener("waiting",onStall);
  $vid.addEventListener("stalled",onStall);
  $vid.addEventListener("playing",onPlaying);
  $vid.addEventListener("error",function(){ if(!refreshing) reload(); });
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden) setTimeout(function(){
      if(started&&$vid.paused&&!refreshing) $vid.play().catch(function(){});
    },400);
  });
  var netConn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change",function(){
      if(!player||restrictionsRelaxed) return;
      var t=netConn.effectiveType||"4g";
      var h=t==="slow-2g"||t==="2g"?240:t==="3g"?480:PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight",h); } catch(_){}
      if(h<PROF.maxH) toast("Slow network — reducing quality","warn",3000);
    });
  }
}

/* ════════════════════════════════════════════
   MAIN
════════════════════════════════════════════ */
async function main(){
  var id=getChId(), data;
  try{ setMsg("Fetching channels…"); data=await loadData(); }
  catch(_){ errMsg("Connection error."); return; }
  if(!id){ renderList(data); return; }
  var chs=data.channels||data;
  var ch=chs.find(function(c){return c.id===id;});
  if(!ch){ errMsg("Channel not found."); return; }
  document.title="SPORTLINK · "+ch.name;
  await startPlayer(ch);
}
document.addEventListener("DOMContentLoaded",main);
})();
